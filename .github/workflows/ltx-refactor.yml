name: Apply LTX conversational scene-master refactor

on:
  push:
    branches:
      - fix/conversational-scene-master

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[ltx-refactor]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch pipeline and compiler
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pipeline.js')
          text = p.read_text()

          old_cap = '''  // LTX guidance recommends staying within 200 words; keep a little headroom
  // so the prompt remains information-dense rather than turning into a contract.
  const words = finalPrompt.split(/\\s+/).filter(Boolean);
  if (words.length > 190) {
    finalPrompt = words.slice(0, 190).join(' ');
    finalPrompt = finalPrompt.replace(/[,;:]?\\s*[^.!?]*$/, '').trim();
  }
  return finalPrompt;'''
          new_cap = '''  // Do not hard-truncate conversational LTX prompts. The official LTX guidance
  // explicitly supports longer screenplay-style prompts for dialogue and multi-beat
  // scenes. Cutting by word count can amputate a quoted line, a listener reaction,
  // a camera beat, or the end-state handoff that the next shot depends on.
  return finalPrompt;'''
          if old_cap not in text:
              raise SystemExit('legacy LTX 190-word cap block not found')
          text = text.replace(old_cap, new_cap, 1)

          start_marker = '  // ── 8. Merge the original shot assets → final master ──────────────────────'
          end_marker = '  const finalVideoUrl = await compiler.pollFFmpegJob(mergeJobId);'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('shot-master merge block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('shot-master merge block end not found')
          end += len(end_marker)

          replacement = '''  // ── 8. Merge compiled scene outputs → final master ───────────────────────
  // Scene compilation is the editorial boundary for the movie. The final master
  // MUST consume the already-compiled scene assets rather than re-feeding every
  // individual shot into FFmpeg. This keeps scene-level pacing/transitions intact
  // and reduces the merge fan-out from O(shots) to O(scenes).
  state.setStatus(state.STATES.COMPILING, 'Merging compiled scenes into final episode...');

  const orderedSceneUrls = sceneNums
    .map(sceneNum => savedSceneState[sceneNum] || null)
    .filter(Boolean);

  if (!orderedSceneUrls.length) {
    const reason = 'No compiled scene assets are available for the final master merge.';
    console.error(`[Pipeline] ${reason}`);
    await saveDraftProgress(draftEpisodeId, savedSceneState, reason);
    state.setStatus(state.STATES.PAUSED, `⏸ ${reason}`);
    await telegram.sendTelegram(`⏸ <b>Episode paused — no compiled scene assets for master merge</b>`).catch(() => {});
    return;
  }

  if (orderedSceneUrls.length !== sceneNums.length) {
    const reason =
      `Final scene merge mismatch: found ${orderedSceneUrls.length}/${sceneNums.length} compiled scenes. ` +
      `Refusing to build an incomplete final episode.`;
    console.error(`[Pipeline] ${reason}`);
    await saveDraftProgress(draftEpisodeId, savedSceneState, reason);
    state.setStatus(state.STATES.PAUSED, `⏸ ${reason}`);
    await telegram.sendTelegram(`⏸ <b>Episode paused — compiled scene source mismatch</b>\\n${reason}`).catch(() => {});
    return;
  }

  console.log(
    `[Pipeline] Final master source = ${orderedSceneUrls.length} compiled scenes ` +
    `(not ${allShots.length} individual shots)`
  );

  const episodeTransition = episodeScript?.episode_transition || null;
  const mergeJobId = await compiler.mergeScenes(orderedSceneUrls, {
    introBumperUrl: process.env.INTRO_BUMPER_URL || null,
    outroBumperUrl: process.env.OUTRO_BUMPER_URL || null,
    transition: episodeTransition,
  });
  const finalVideoUrl = await compiler.pollFFmpegJob(mergeJobId);'''

          text = text[:start] + replacement + text[end:]
          p.write_text(text)

          c = Path('src/compiler.js')
          ctext = c.read_text()
          ctext = ctext.replace(
              ''' * The final master should receive the original shot assets whenever possible,
 * not already-encoded scene outputs. That avoids cascading re-encodes.''',
              ''' * The final master receives already-compiled scene outputs. Scene compilation
 * is the editorial boundary; the master merge should not re-fan-out individual shots.''',
              1,
          )
          c.write_text(ctext)

      - name: Run syntax and regression tests
        shell: bash
        run: |
          node --check src/pipeline.js
          node --check src/compiler.js
          node --check src/ltxPromptEngine.js
          node --check src/ltxVideoGen.js
          node --check src/ltxVisionDirector.js
          python -m compileall -q video_engine
          python -m pytest -q video_engine/tests

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pipeline.js src/compiler.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m '[ltx-refactor] make scene outputs the episode master boundary'
          git push
