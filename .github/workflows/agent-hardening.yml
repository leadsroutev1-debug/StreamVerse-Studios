name: Agent hardening migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !startsWith(github.event.head_commit.message, '[agent-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply targeted agent and DB hardening
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              original = s
              for old, new, label in replacements:
                  if old not in s:
                      raise SystemExit(f'PATCH FAILED: {path}: {label}')
                  s = s.replace(old, new, 1)
              if s == original:
                  raise SystemExit(f'PATCH MADE NO CHANGE: {path}')
              p.write_text(s, encoding='utf-8')
              print(f'patched {path}')

          patch('src/db.js', [
              (
              "      posted_at           DATETIME      NULL,\n      created_at          DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP,\n      INDEX idx_storyline",
              "      posted_at           DATETIME      NULL,\n      created_at          DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP,\n      updated_at          DATETIME      NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n      INDEX idx_storyline",
              'episodes updated_at canonical column'),
              (
              "    [`episodes`,    `ready_at`,            `ALTER TABLE episodes ADD COLUMN ready_at DATETIME NULL COMMENT 'Final compilation completed; waiting for manual review/publish'`],",
              "    [`episodes`,    `ready_at`,            `ALTER TABLE episodes ADD COLUMN ready_at DATETIME NULL COMMENT 'Final compilation completed; waiting for manual review/publish'`],\n    [`episodes`,    `updated_at`,          `ALTER TABLE episodes ADD COLUMN updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP`],",
              'episodes updated_at migration'),
              (
              "function sanitizeParams(params) {\n  if (params == null) return [];\n  if (!Array.isArray(params)) {\n    throw new TypeError('Database parameters must be an array');\n  }\n  return params.map(p => (p === undefined ? null : p));\n}",
              "function _sanitizeDbString(value) {\n  if (typeof value !== 'string') return value;\n  // Node strings can contain lone UTF-16 surrogates. mysql2 encodes those as\n  // invalid UTF-8; MySQL JSON columns then reject the entire document.\n  return Buffer.from(value, 'utf8').toString('utf8');\n}\n\nfunction _sanitizeDbValue(value) {\n  if (value === undefined) return null;\n  if (typeof value === 'string') return _sanitizeDbString(value);\n  if (value && Object.getPrototypeOf(value) === Object.prototype) {\n    const normalized = {};\n    for (const [k, v] of Object.entries(value)) normalized[_sanitizeDbString(k)] = _sanitizeDbValue(v);\n    return JSON.stringify(normalized);\n  }\n  if (Array.isArray(value)) {\n    const normalized = value.map(_sanitizeDbValue);\n    return JSON.stringify(normalized);\n  }\n  return value;\n}\n\nfunction sanitizeParams(params) {\n  if (params == null) return [];\n  if (!Array.isArray(params)) {\n    throw new TypeError('Database parameters must be an array');\n  }\n  return params.map(_sanitizeDbValue);\n}",
              'UTF-8/JSON-safe DB parameter normalization')
          ])

          patch('src/agentProductionTools.js', [
              (
              "  const existing = script.narrative_simulation || null;\n  const expected = 10;",
              "  const existing = script.narrative_simulation || null;\n  const expected = Math.max(1, Number(trajectory?.scene_count || trajectory?.sceneCount || trajectory?.scenes?.length || config.scenesPerEpisode || 10));",
              'derive expected scene count'),
              (
              "  current = await scriptWriter.simulateEpisodeStory({ storyline, characters:chars, recentEpisodes:await db.query(`SELECT * FROM episodes WHERE storyline_id=? AND status IN ('ready','published') ORDER BY episode_number DESC LIMIT 5`,[storyline.id]), episodeNumber:Number(episode.episode_number), seasonNumber:Number(episode.season_number), isFinale:Number(episode.episode_number)===num(config.episodesPerSeason,1), isSeriesMovie:false, targetMinutes:num(config.targetEpisodeMinSeconds,120)/60, episodeTrajectory:trajectory, existingSimulation:existing, checkpoint:save });\n  return {ok:true,simulation:current};",
              "  current = await scriptWriter.simulateEpisodeStory({ storyline, characters:chars, recentEpisodes:await db.query(`SELECT * FROM episodes WHERE storyline_id=? AND status IN ('ready','published') ORDER BY episode_number DESC LIMIT 5`,[storyline.id]), episodeNumber:Number(episode.episode_number), seasonNumber:Number(episode.season_number), isFinale:Number(episode.episode_number)===num(config.episodesPerSeason,1), isSeriesMovie:false, targetMinutes:num(config.targetEpisodeMinSeconds,120)/60, episodeTrajectory:trajectory, existingSimulation:existing, checkpoint:save });\n  const scenePlan = Array.isArray(current?.scene_beat_plan) ? current.scene_beat_plan : [];\n  const complete = current?.simulation_status === 'complete' && scenePlan.length >= expected;\n  if (!complete) {\n    return {ok:false,pending:true,reason:'Episode scene simulation is not complete',simulation:current,expected_scene_count:expected,actual_scene_count:scenePlan.length};\n  }\n  return {ok:true,simulation:current};",
              'block downstream progression until scene simulation is complete'),
              (
              "  const narrative = draftScript.narrative_simulation;\n  if (!narrative) throw new Error('Episode scene simulation is not complete');",
              "  const narrative = draftScript.narrative_simulation;\n  const expectedScenes = Math.max(1, Number((await db.queryOne(`SELECT scene_count FROM episodes WHERE id=?`,[episode.id]))?.scene_count || config.scenesPerEpisode || 10));\n  if (!narrative || narrative.simulation_status !== 'complete' || !Array.isArray(narrative.scene_beat_plan) || narrative.scene_beat_plan.length < expectedScenes) {\n    throw new Error(`Episode scene simulation is not complete: ${Array.isArray(narrative?.scene_beat_plan) ? narrative.scene_beat_plan.length : 0}/${expectedScenes}`);\n  }",
              'script writer predecessor gate'),
              (
              "  if (typeof pipeline.generateEpisodeMediaAgent === 'function') return pipeline.generateEpisodeMediaAgent(episode_id,{sceneNumber:scene_number,shotIndex:shot_index});",
              "  if (typeof pipeline.generateEpisodeMediaAgent === 'function') {\n    const result = await pipeline.generateEpisodeMediaAgent(episode_id,{sceneNumber:scene_number,shotIndex:shot_index});\n    const activeJobs = await recovery.queryActiveJobs(episode_id).catch(()=>[]);\n    if (Array.isArray(activeJobs) && activeJobs.length) return {ok:false,pending:true,reason:'Media generation is still in progress; do not advance the production state yet',active_jobs:activeJobs,result};\n    return result;\n  }",
              'media completion gate')
          ])

          p = Path('src/agentOrchestrator.js')
          s = p.read_text(encoding='utf-8')
          old = "  let lastDecision = null;\n  try {\n    for (let step = 0; step < limit; step++) {"
          new = "  let lastDecision = null;\n  let lastToolFingerprint = null;\n  let blockedAfterFailure = false;\n  const diagnosticTools = new Set(['production_state','classify_error','trace_root_cause','diagnose_provider_failure','validate_all_invariants','find_stuck_work','find_invalid_transitions','find_orphaned_work','find_skipped_work','find_out_of_order_work','detect_retry_loop','detect_timeout_loop','detect_rate_limit_loop','detect_provider_degradation','build_recovery_plan','checkpoint_production']);\n  const productionToolNames = new Set(['initialize_series','simulate_season','ensure_episode_draft','simulate_episode_scenes','write_episode_script','prepare_shot_rows','generate_episode_media','compile_episode','validate_episode','publish_episode']);\n  try {\n    for (let step = 0; step < limit; step++) {"
          if old not in s: raise SystemExit('PATCH FAILED: orchestrator loop anchor')
          s = s.replace(old,new,1)

          old = "        const name = call?.function?.name;\n        const fn = toolByName.get(name);\n        let result;\n        const args = jsonParse(call?.function?.arguments, {});\n        if (!fn) result = { error: `Unknown tool ${name}` };\n        else {\n          try {\n            result = await fn.handler(args);"
          new = "        const name = call?.function?.name;\n        const fn = toolByName.get(name);\n        let result;\n        const args = jsonParse(call?.function?.arguments, {});\n        const fingerprint = `${name}:${JSON.stringify(args)}`;\n        if (blockedAfterFailure && productionToolNames.has(name) && !diagnosticTools.has(name)) {\n          result = {ok:false,blocked:true,error:'Production action blocked after a failed/pending tool result. Diagnose the failure or re-inspect production_state before selecting another production action.',code:'AGENT_RECOVERY_GATE'};\n        } else if (fingerprint === lastToolFingerprint && productionToolNames.has(name)) {\n          result = {ok:false,blocked:true,error:'Identical production action was requested twice without new evidence. Re-inspect production_state and make a targeted repair instead of oscillating.',code:'AGENT_NO_PROGRESS'};\n        } else if (!fn) result = { error: `Unknown tool ${name}` };\n        else {\n          try {\n            result = await fn.handler(args);"
          if old not in s: raise SystemExit('PATCH FAILED: orchestrator handler anchor')
          s = s.replace(old,new,1)

          old = "        messages.push({ role: 'tool', tool_call_id: call.id, name, content: JSON.stringify(result) });"
          new = "        lastToolFingerprint = fingerprint;\n        if (productionToolNames.has(name)) {\n          blockedAfterFailure = !!(result?.error || result?.pending || result?.blocked || result?.ok === false);\n          if (!blockedAfterFailure && (result?.ok === true || result?.status === 'completed')) blockedAfterFailure = false;\n        } else if (diagnosticTools.has(name) && result?.ok !== false) {\n          // Diagnostics/inspection are explicitly allowed to break the recovery gate.\n          blockedAfterFailure = false;\n        }\n        messages.push({ role: 'tool', tool_call_id: call.id, name, content: JSON.stringify(result) });"
          if old not in s: raise SystemExit('PATCH FAILED: orchestrator result anchor')
          s = s.replace(old,new,1)

          old = "`6. When a tool fails, diagnose with the recovery tools already available, repair only the owning unit, then re-inspect production_state.\\n` +"
          new = "`6. When a tool fails or returns pending, STOP production progression. Diagnose the concrete failure, repair only the owning unit, then re-inspect production_state before choosing another production tool.\\n` +\n`7. Never repeat the identical production tool call with identical arguments unless new durable evidence proves the state changed.\\n` +"
          if old not in s: raise SystemExit('PATCH FAILED: orchestrator system prompt anchor')
          s = s.replace(old,new,1)
          # Renumber the following prompt bullets without changing semantics.
          s = s.replace("`7. Preserve locked creative continuity.", "`9. Preserve locked creative continuity.", 1)
          s = s.replace("`8. You may use ALL database inspection/recovery tools", "`10. You may use ALL database inspection/recovery tools", 1)

          p.write_text(s, encoding='utf-8')
          print('patched src/agentOrchestrator.js')
          PY

      - name: Verify syntax
        run: |
          node --check src/db.js
          node --check src/agentProductionTools.js
          node --check src/agentOrchestrator.js

      - name: Commit hardened architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/db.js src/agentProductionTools.js src/agentOrchestrator.js
          git diff --cached --check
          git commit -m "[agent-hardening] Make agent stateful, sequential, and schema-safe"
          git push
