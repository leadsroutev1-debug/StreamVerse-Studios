name: Expose Agent Reset Control

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-agent-reset:
    if: ${{ !contains(github.event.head_commit.message, '[agent-reset-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard reset UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('views/dashboard.html')
          s = p.read_text(encoding='utf-8')
          marker = 'AGENT_RESET_DASHBOARD_V2'
          if marker in s:
              print('Reset UI already present')
          else:
              button = '''<button id="agentResetBtn" class="memory-btn" onclick="openAgentResetModal()" title="Reset agent state without deleting production data">🧠 Reset Agent State</button>'''
              needle = '<button class="memory-btn" id="agentMemoryPrune">Prune Low-Priority Memory</button>'
              if needle not in s:
                  raise SystemExit('Agent memory prune control not found')
              s = s.replace(needle, needle + '\n    ' + button + '\n    <span id="AGENT_RESET_DASHBOARD_V2" style="display:none"></span>', 1)

              modal = '''\n<div id="agentResetModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:4000;align-items:center;justify-content:center;padding:18px">\n  <div class="card" style="max-width:520px;width:100%;border-color:rgba(239,68,68,.35)">\n    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h3 style="margin:0;color:var(--text)">🧠 Reset Agent State</h3><button class="refresh-btn" style="margin:0" onclick="closeAgentResetModal()">✕</button></div>\n    <p style="margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6">This resets the agent's resumable runs, agent memory, event telemetry and LLM telemetry. <strong style="color:var(--text)">Production data is not deleted.</strong> Storylines, episodes, scripts, shots, characters and generated media remain intact.</p>\n    <div style="margin-top:12px;padding:10px;border:1px solid rgba(239,68,68,.25);border-radius:7px;background:rgba(239,68,68,.06);color:#fca5a5;font-size:11px">The agent will reassess the current studio state from scratch after the reset.</div>\n    <input id="agentResetConfirmation" class="sheet-input" placeholder="Type RESET_AGENT_STATE" autocomplete="off" style="width:100%;margin-top:14px">\n    <div id="agentResetResult" style="margin-top:10px;font-size:12px;display:none"></div>\n    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px">\n      <button class="refresh-btn" style="margin:0" onclick="closeAgentResetModal()">Cancel</button>\n      <button id="agentResetConfirmBtn" class="memory-btn" style="margin:0" onclick="confirmAgentReset()">Reset Agent State</button>\n    </div>\n  </div>\n</div>\n'''
              close = s.rfind('</body>')
              if close < 0:
                  raise SystemExit('Dashboard closing body tag not found')
              s = s[:close] + modal + s[close:]

              js = '''\n<script>\n(function(){\n  window.openAgentResetModal=function(){\n    const m=document.getElementById('agentResetModal');\n    if(!m)return;\n    document.getElementById('agentResetConfirmation').value='';\n    document.getElementById('agentResetResult').style.display='none';\n    const b=document.getElementById('agentResetConfirmBtn'); b.disabled=false; b.textContent='Reset Agent State';\n    m.style.display='flex'; document.body.style.overflow='hidden';\n  };\n  window.closeAgentResetModal=function(){\n    const m=document.getElementById('agentResetModal');\n    if(m)m.style.display='none'; document.body.style.overflow='';\n  };\n  window.confirmAgentReset=async function(){\n    const confirmation=document.getElementById('agentResetConfirmation').value.trim();\n    const result=document.getElementById('agentResetResult');\n    const btn=document.getElementById('agentResetConfirmBtn');\n    if(confirmation!=='RESET_AGENT_STATE'){\n      result.style.cssText='margin-top:10px;font-size:12px;display:block;color:#f87171';\n      result.textContent='✗ Type RESET_AGENT_STATE exactly to confirm'; return;\n    }\n    btn.disabled=true; btn.textContent='Resetting…';\n    try{\n      const r=await fetch('/api/agent/memory/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation,include_events:true,include_llm_calls:true})});\n      const d=await r.json();\n      if(!r.ok||!d.ok)throw new Error(d.error||'Agent reset failed');\n      const x=d.deleted||{};\n      result.style.cssText='margin-top:10px;font-size:12px;display:block;color:#4ade80';\n      result.textContent='✓ Reset complete — '+(x.runs||0)+' runs, '+(x.memory||0)+' memories, '+(x.events||0)+' events, '+(x.llmCalls||0)+' LLM records removed. Production data untouched.';\n      btn.textContent='Done';\n      setTimeout(()=>{closeAgentResetModal(); location.reload();},1500);\n    }catch(e){\n      result.style.cssText='margin-top:10px;font-size:12px;display:block;color:#f87171';\n      result.textContent='✗ '+e.message; btn.disabled=false; btn.textContent='Reset Agent State';\n    }\n  };\n})();\n</script>\n'''
              s = s[:close] + js + s[close:]
              p.write_text(s, encoding='utf-8')
              print('Reset UI patched')
      - name: Validate
        run: |
          node --check index.js
          node --check src/agentDashboard.js
          python - <<'PY'
          from pathlib import Path
          s=Path('views/dashboard.html').read_text(encoding='utf-8')
          for x in ('AGENT_RESET_DASHBOARD_V2','Reset Agent State','openAgentResetModal','/api/agent/memory/reset','RESET_AGENT_STATE'):
              assert x in s, x
          print('Agent reset dashboard UI verified')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/dashboard.html .github/workflows/expose-agent-reset.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose agent reset control in dashboard [agent-reset-ui]"
          git push origin HEAD:main
