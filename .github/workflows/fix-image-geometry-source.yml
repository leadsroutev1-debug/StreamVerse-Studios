name: Fix image geometry source contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch canonical image geometry validator
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/constraintEnforcer.js')
          s = p.read_text(encoding='utf-8')
          original = s

          replacements = {
              "Aspect ratio must be 9:16 vertical (1080×1920 or proportional)":
                  "Aspect ratio must match the production 2:3 portrait frame (1024×1536 or proportional)",
              "const TARGET_ASPECT_RATIO = 9 / 16;   // 0.5625":
                  "const TARGET_ASPECT_RATIO = 2 / 3;   // 0.666666... for 1024×1536 production frame",
              "const MIN_HEIGHT          = 1280;":
                  "const MIN_HEIGHT          = 1080;",
              "// Aspect ratio check — must be 9:16 vertical":
                  "// Aspect ratio check — must match the canonical 2:3 portrait production frame",
              "const isFilmStrip = aspect > 0.7 && w > h * 0.8 && w < h * 1.5;":
                  "const isWidePortrait = aspect > TARGET_ASPECT_RATIO && aspect < 1.0;",
              "else if (isFilmStrip) framingIssue = 'film-strip / multi-panel layout instead of single image';":
                  "else if (isWidePortrait) framingIssue = 'portrait frame wider than the canonical 2:3 target';",
              "`Wrong camera framing: ${framingIssue} (${w}×${h}, aspect ${aspect.toFixed(3)})`":
                  "`Wrong camera framing: ${framingIssue} (${w}×${h}, aspect ${aspect.toFixed(3)}; expected 2:3 ≈ 0.667)`",
              "`CRITICAL: Produce ONE single image in 9:16 VERTICAL PORTRAIT orientation, exactly 1080×1920 pixels. NO landscape layout. NO film strips. NO multiple panels. NO square. The image MUST be taller than it is wide.`":
                  "`CRITICAL: Produce ONE single image in the canonical 2:3 PORTRAIT frame, preferably exactly 1024×1536 pixels. NO landscape layout. NO film strips. NO multiple panels. NO square. Keep one continuous tall portrait frame.`",
              "`CRITICAL: Generate at full resolution, minimum 1080×1920 pixels. Do not produce a low-resolution thumbnail.`":
                  "`CRITICAL: Generate at the production portrait resolution, preferably 1024×1536 pixels. Do not produce a low-resolution thumbnail.`",
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source text: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          if s == original:
              raise SystemExit('No source change made')

      - name: Syntax check
        run: node --check src/constraintEnforcer.js

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/constraintEnforcer.js .github/workflows/fix-image-geometry-source.yml
          git commit -m 'Fix production image aspect validation for 1024x1536'
          git push

      - name: Remove migration workflow
        if: ${{ success() }}
        shell: bash
        run: |
          git rm -f .github/workflows/fix-image-geometry-source.yml || true
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove completed geometry migration workflow'
            git push
          fi
