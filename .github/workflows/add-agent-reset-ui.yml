name: Add agent reset controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[ui-agent-reset]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch API and dashboard
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('index.js')
          s = p.read_text()
          anchor = "app.post('/api/agent/memory/prune', async (req,res)=>{"
          if anchor not in s: raise SystemExit('agent prune endpoint not found')
          insert = """app.post('/api/agent/memory/reset', async (req,res)=>{
  try {
    if (req.body?.confirm !== 'RESET_AGENT_STATE') return res.status(400).json({ok:false,error:'Explicit confirmation required'});
    const data = await agentDashboard.resetAgentState({
      storylineId:req.body?.storyline_id||null,
      episodeId:req.body?.episode_id||null,
      includeEvents:req.body?.include_events !== false,
      includeLlmCalls:req.body?.include_llm_calls !== false,
    });
    res.json(data);
  } catch(err) { console.error('[API /agent/memory/reset]', err); res.status(500).json({ok:false,error:err.message}); }
});

"""
          s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s)

          p = Path('views/dashboard.html')
          s = p.read_text()
          marker = "<title>StreamVerse Studios — Control Room</title>"
          ui = """
<style id="agent-reset-controls">
.agent-memory-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.agent-memory-controls button{background:transparent;color:var(--muted);border:1px solid var(--border);padding:7px 12px;border-radius:6px;font-size:11px;cursor:pointer}
.agent-memory-controls button:hover{color:var(--text);border-color:var(--muted)}
.agent-memory-controls .danger{color:var(--danger);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.agent-memory-reset-status{font-size:11px;color:var(--muted);margin-top:7px;min-height:16px}
</style>
"""
          if 'id="agent-reset-controls"' not in s:
              s = s.replace(marker, marker + ui, 1)

          body_marker = '<body>'
          panel = """
<section class="card accent-top" id="agent-memory-control-panel" style="margin:16px 24px;max-width:1280px;margin-left:auto;margin-right:auto">
  <h3>Agent Memory & State</h3>
  <div style="color:var(--muted);font-size:12px">Prune removes stale low-priority memory. Full reset clears the agent's resumable runs, memory, telemetry and live activity without deleting production data.</div>
  <div class="agent-memory-controls">
    <button id="agent-memory-prune-btn">Prune stale memory</button>
    <button id="agent-memory-reset-btn" class="danger">Reset agent state</button>
  </div>
  <div id="agent-memory-reset-status" class="agent-memory-reset-status"></div>
</section>
<script>
(function(){
  const prune=document.getElementById('agent-memory-prune-btn');
  const reset=document.getElementById('agent-memory-reset-btn');
  const status=document.getElementById('agent-memory-reset-status');
  function msg(t,err){status.textContent=t;status.style.color=err?'var(--danger)':'var(--muted)';}
  prune?.addEventListener('click',async()=>{
    if(!confirm('Prune stale low-priority agent memory? Active/high-priority memory is preserved.')) return;
    prune.disabled=true; msg('Pruning…');
    try{const r=await fetch('/api/agent/memory/prune',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keep_priority_at_least:70,older_than_days:14})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Prune failed');msg(`Pruned ${d.pruned} memory records.`);}catch(e){msg(e.message,true)}finally{prune.disabled=false}
  });
  reset?.addEventListener('click',async()=>{
    const warning='This clears ALL agent memory, resumable runs, events, LLM telemetry and live agent activity.\n\nIt DOES NOT delete storylines, episodes, scripts, shots, characters or media.\n\nContinue?';
    if(!confirm(warning)) return;
    if(prompt('Type RESET_AGENT_STATE to confirm:')!=='RESET_AGENT_STATE'){msg('Reset cancelled: confirmation did not match.',true);return}
    reset.disabled=true; msg('Resetting agent state…');
    try{const r=await fetch('/api/agent/memory/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:'RESET_AGENT_STATE'})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Reset failed');const x=d.deleted||{};msg(`Agent reset complete — runs ${x.runs||0}, memory ${x.memory||0}, events ${x.events||0}, LLM telemetry ${x.llmCalls||0} removed.`);}catch(e){msg(e.message,true)}finally{reset.disabled=false}
  });
})();
</script>
"""
          if 'id="agent-memory-control-panel"' not in s:
              s = s.replace(body_marker, body_marker + panel, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: node --check index.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js views/dashboard.html
          git diff --cached --check
          git commit -m "[ui-agent-reset] Add agent memory prune and full reset controls"
          git push
